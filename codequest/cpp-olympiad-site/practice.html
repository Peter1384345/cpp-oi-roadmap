      // --- 综合模拟 (4) ---
      {

        explanation: 'C++ 中二维数组按行优先存储。a[0][0], a[0][1], a[0][2], a[1][0], a[1][1], a[1][2] 分别是第 1~6 个元素，所以 <code>a[1][2]</code> 是第 6 个。'

        answer: [1],
        explanation: '每次递归调用都会在调用栈上分配栈帧。递归深度过大会耗尽栈空间，导致<strong>栈溢出</strong>（Stack Overflow），程序崩溃。'

    // ============================================================
    //  Category Config
    // ============================================================
    const CATEGORIES = {
      '语法基础':  { color: '#0ea5e9', bg: 'rgba(14,165,233,0.15)' },
      '流程控制':  { color: '#8b5cf6', bg: 'rgba(139,92,246,0.15)' },
      '函数与递归': { color: '#ec4899', bg: 'rgba(236,72,153,0.15)' },
      '数据结构':  { color: '#10b981', bg: 'rgba(16,185,129,0.15)' },
      '综合模拟':  { color: '#f59e0b', bg: 'rgba(245,158,11,0.15)' }
    };

    const DIFFICULTY_LABELS = { 1: '基础', 2: '进阶', 3: '挑战' };
    const OPTION_LETTERS = ['A', 'B', 'C', 'D'];

    // ============================================================
    //  State
    // ============================================================
    let currentTab = '语法基础';
    let filterCategory = 'all';
    let filterDifficulty = 'all';
    let filterStatus = 'all';

    // ============================================================
    //  Init
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      renderAllPanels();
      updateStats();
      renderWrongList();
    });

    // ============================================================
    //  Tab Switching
    // ============================================================
    function switchTab(tabName, btnEl) {
      currentTab = tabName;
      // Update buttons
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-btn--active'));
      if (btnEl) btnEl.classList.add('tab-btn--active');
      // Update panels
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('tab-panel--active'));
      const panel = document.querySelector(`.tab-panel[data-panel="${tabName}"]`);
      if (panel) panel.classList.add('tab-panel--active');
    }

    // ============================================================
    //  Render Questions
    // ============================================================
    function renderAllPanels() {
      Object.keys(CATEGORIES).forEach(cat => {
        const panel = document.querySelector(`.tab-panel[data-panel="${cat}"]`);
        if (!panel) return;
        const questions = QUESTIONS.filter(q => q.category === cat);
        panel.innerHTML = questions.map(q => renderQuestionCard(q)).join('');
      });
    }

    function renderQuestionCard(q) {
      const cat = CATEGORIES[q.category] || { color: '#0ea5e9', bg: 'rgba(14,165,233,0.15)' };
      const userAnswer = localStorage.getItem('practice-Q' + q.id);
      const isCorrect = localStorage.getItem('practice-Q' + q.id + '-correct');
      let statusClass = 'question-card';
      let statusHTML = '';
      let answered = false;

      if (userAnswer !== null && isCorrect !== null) {
        answered = true;
        if (isCorrect === 'true') {
          statusClass += ' question-card--correct';
          statusHTML = `<span class="question-status question-status--correct">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            正确</span>`;
        } else {
          statusClass += ' question-card--incorrect';
          statusHTML = `<span class="question-status question-status--incorrect">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            错误</span>`;
        }
      } else {
        statusHTML = `<span class="question-status question-status--unanswered">未答</span>`;
      }

      // Build answer area
      let answerArea = '';
      if (q.type === 'multiple') {
        answerArea = renderMultipleChoice(q, userAnswer, isCorrect);
      } else {
        answerArea = renderFillBlank(q, userAnswer, isCorrect);
      }

      return `
        <div class="${statusClass}" id="qcard-${q.id}" data-id="${q.id}" data-category="${q.category}" data-difficulty="${q.difficulty}" data-answered="${answered}">
          <div class="question-card__header">
            <span class="question-card__number">Q${q.id}</span>
            <span class="difficulty-badge difficulty-badge--${q.difficulty}">${DIFFICULTY_LABELS[q.difficulty]}</span>
            <span class="topic-tag" style="background:${cat.bg};color:${cat.color}">${q.category}</span>
            ${statusHTML}
          </div>
          <div class="question-card__text">${q.question}</div>
          ${answerArea}
          ${answered ? renderExplanation(q) : renderExplanationToggle(q)}
        </div>`;
    }

    function renderMultipleChoice(q, userAnswer, isCorrect) {
      const answered = userAnswer !== null && isCorrect !== null;
      const selected = answered ? JSON.parse(userAnswer) : [];
      const correct = q.answer;
      const correctBool = isCorrect === 'true';

      let html = '<div class="options-grid">';
      q.options.forEach((opt, idx) => {
        let cls = 'option-btn';
        if (answered) {
          cls += ' option-btn--disabled';
          if (correct.includes(idx)) cls += ' option-btn--correct';
          if (selected.includes(idx) && !correct.includes(idx)) cls += ' option-btn--wrong';
        }
        const disabled = answered ? 'pointer-events:none;' : '';
        const click = answered ? '' : `onclick="selectOption(${q.id}, ${idx})"`;
        html += `<button class="${cls}" style="${disabled}" ${click} id="opt-${q.id}-${idx}">
          <span class="option-letter">${OPTION_LETTERS[idx]}</span>
          <span>${opt}</span>
        </button>`;
      });
      html += '</div>';

      // Submit button for multiple (for multi-select)
      if (!answered) {
        html += `<div id="multi-actions-${q.id}" style="display:none;">
          <button class="fill-submit" onclick="submitMultiple(${q.id})">确认答案</button>
        </div>`;
      }

      return html;
    }

    function renderFillBlank(q, userAnswer, isCorrect) {
      const answered = userAnswer !== null && isCorrect !== null;
      let resultHTML = '';
      if (answered) {
        if (isCorrect === 'true') {
          resultHTML = `<span class="fill-result fill-result--correct">正确!</span>`;
        } else {
          resultHTML = `<span class="fill-result fill-result--incorrect">正确答案: ${q.answer.join(' / ')}</span>`;
        }
      }

      return `<div class="fill-area">
        <input class="fill-input" type="text" id="fill-${q.id}" placeholder="输入你的答案..."
          ${answered ? 'disabled' : ''} value="${answered ? userAnswer : ''}"
          onkeydown="if(event.key==='Enter')submitFill(${q.id})" />
        <button class="fill-submit" ${answered ? 'disabled' : ''} onclick="submitFill(${q.id})">提交</button>
        ${resultHTML}
      </div>`;
    }

    function renderExplanationToggle(q) {
      return `<button class="explanation-toggle" onclick="toggleExplanation(${q.id})" id="exptoggle-${q.id}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        查看解析
      </button>
      <div class="explanation-content" id="exp-${q.id}">${q.explanation}</div>`;
    }

    function renderExplanation(q) {
      return `<button class="explanation-toggle explanation-toggle--open" onclick="toggleExplanation(${q.id})" id="exptoggle-${q.id}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        查看解析
      </button>
      <div class="explanation-content explanation-content--open" id="exp-${q.id}">${q.explanation}</div>`;
    }

    // ============================================================
    //  Interaction: Multiple Choice
    // ============================================================
    function selectOption(qid, idx) {
      const q = QUESTIONS.find(x => x.id === qid);
      if (!q) return;
      // Check if already answered
      if (localStorage.getItem('practice-Q' + qid + '-correct') !== null) return;

      // Check if it's a multi-select question
      const isMulti = q.answer.length > 1;
      const actionsDiv = document.getElementById('multi-actions-' + qid);

      if (isMulti) {
        // Toggle selection for multi-select
        const btn = document.getElementById('opt-' + qid + '-' + idx);
        if (btn.classList.contains('option-btn--selected')) {
          btn.classList.remove('option-btn--selected');
        } else {
          btn.classList.add('option-btn--selected');
        }
        // Show/hide submit button
        const selectedCount = document.querySelectorAll(`#qcard-${qid} .option-btn--selected`).length;
        if (actionsDiv) actionsDiv.style.display = selectedCount > 0 ? 'block' : 'none';
      } else {
        // Single select: immediately check
        checkAnswer(qid, [idx]);
      }
    }

    function submitMultiple(qid) {
      const q = QUESTIONS.find(x => x.id === qid);
      if (!q) return;
      const selectedBtns = document.querySelectorAll(`#qcard-${qid} .option-btn--selected`);
      const selected = [];
      selectedBtns.forEach(btn => {
        const idStr = btn.id; // opt-{qid}-{idx}
        const parts = idStr.split('-');
        selected.push(parseInt(parts[2]));
      });
      if (selected.length === 0) return;
      checkAnswer(qid, selected);
    }

    // ============================================================
    //  Interaction: Fill in Blank
    // ============================================================
    function submitFill(qid) {
      const q = QUESTIONS.find(x => x.id === qid);
      if (!q) return;
      const input = document.getElementById('fill-' + qid);
      if (!input) return;
      const userVal = input.value.trim();
      if (!userVal) return;

      const isCorrect = q.answer.some(a => a.toLowerCase() === userVal.toLowerCase());
      saveAnswer(qid, userVal, isCorrect);
      refreshCard(qid);
      updateStats();
      renderWrongList();
    }

    // ============================================================
    //  Check & Save
    // ============================================================
    function checkAnswer(qid, selected) {
      const q = QUESTIONS.find(x => x.id === qid);
      if (!q) return;

      const correctArr = q.answer.slice().sort();
      const selectedArr = selected.slice().sort();
      const isCorrect = JSON.stringify(correctArr) === JSON.stringify(selectedArr);

      saveAnswer(qid, JSON.stringify(selected), isCorrect);
      refreshCard(qid);
      updateStats();
      renderWrongList();
    }

    function saveAnswer(qid, answer, isCorrect) {
      localStorage.setItem('practice-Q' + qid, answer);
      localStorage.setItem('practice-Q' + qid + '-correct', isCorrect.toString());
      // Write topic and difficulty for dashboard consumption
      var qData = QUESTIONS.find(function(q) { return q.id === qid; });
      if (qData) {
        localStorage.setItem('practice-Q' + qid + '-topic', qData.category);
        var diffMap = {1: 'basic', 2: 'intermediate', 3: 'challenge'};
        localStorage.setItem('practice-Q' + qid + '-difficulty', diffMap[qData.difficulty] || 'basic');
      }

      // Update streak
      if (isCorrect) {
        let streak = parseInt(localStorage.getItem('practice-streak') || '0');
        streak++;
        localStorage.setItem('practice-streak', streak.toString());
        var xp = parseInt(localStorage.getItem('xp-total') || '0') + 5;
        localStorage.setItem('xp-total', String(xp));
      } else {
        localStorage.setItem('practice-streak', '0');
      }
    }

    function refreshCard(qid) {
      const q = QUESTIONS.find(x => x.id === qid);
      if (!q) return;
      const card = document.getElementById('qcard-' + qid);
      if (!card) return;

      const temp = document.createElement('div');
      temp.innerHTML = renderQuestionCard(q);
      const newCard = temp.firstElementChild;
      card.replaceWith(newCard);
    }

    // ============================================================
    //  Explanation Toggle
    // ============================================================
    function toggleExplanation(qid) {
      const exp = document.getElementById('exp-' + qid);
      const toggle = document.getElementById('exptoggle-' + qid);
      if (!exp) return;
      if (exp.classList.contains('explanation-content--open')) {
        exp.classList.remove('explanation-content--open');
        if (toggle) toggle.classList.remove('explanation-toggle--open');
      } else {
        exp.classList.add('explanation-content--open');
        if (toggle) toggle.classList.add('explanation-toggle--open');
      }
    }

    // ============================================================
    //  Stats
    // ============================================================
    function updateStats() {
      let total = QUESTIONS.length;
      let done = 0;
      let correct = 0;
      QUESTIONS.forEach(q => {
        const c = localStorage.getItem('practice-Q' + q.id + '-correct');
        if (c !== null) {
          done++;
          if (c === 'true') correct++;
        }
      });
      const accuracy = done > 0 ? Math.round((correct / done) * 100) : 0;
      const streak = parseInt(localStorage.getItem('practice-streak') || '0');

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statDone').textContent = done;
      document.getElementById('statAccuracy').textContent = accuracy + '%';
      document.getElementById('statStreak').textContent = streak;
    }

    // ============================================================
    //  Wrong List
    // ============================================================
    function renderWrongList() {
      const container = document.getElementById('wrongList');
      const wrongQs = QUESTIONS.filter(q => {
        const c = localStorage.getItem('practice-Q' + q.id + '-correct');
        return c !== null && c === 'false';
      });

      if (wrongQs.length === 0) {
        container.innerHTML = `<div class="wrong-empty">太棒了！目前没有错题</div>`;
        return;
      }

      container.innerHTML = wrongQs.map(q => {
        const cat = CATEGORIES[q.category] || { color: '#0ea5e9', bg: 'rgba(14,165,233,0.15)' };
        return `<div class="wrong-card" id="wrong-${q.id}">
          <div class="wrong-card__info">
            <div class="wrong-card__q">Q${q.id}. ${stripHTML(q.question)}</div>
            <div class="wrong-card__meta">
              <span style="color:${cat.color}">${q.category}</span>
              <span class="difficulty-badge difficulty-badge--${q.difficulty}" style="font-size:0.7rem">${DIFFICULTY_LABELS[q.difficulty]}</span>
            </div>
          </div>
          <button class="btn-retry" onclick="retryQuestion(${q.id})">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
            重新作答
          </button>
        </div>`;
      }).join('');
    }

    function retryQuestion(qid) {
      // Clear stored answer
      localStorage.removeItem('practice-Q' + qid);
      localStorage.removeItem('practice-Q' + qid + '-correct');

      // Switch to the correct tab
      const q = QUESTIONS.find(x => x.id === qid);
      if (!q) return;

      // Find and click the tab button
      const tabBtn = document.querySelector(`.tab-btn[data-tab="${q.category}"]`);
      switchTab(q.category, tabBtn);

      // Refresh that panel
      refreshCard(qid);

      // Scroll to the card
      setTimeout(() => {
        const card = document.getElementById('qcard-' + qid);
        if (card) {
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          card.style.boxShadow = '0 0 0 2px var(--accent)';
          setTimeout(() => { card.style.boxShadow = ''; }, 2000);
        }
      }, 100);

      updateStats();
      renderWrongList();
    }

    // ============================================================
    //  Filters
    // ============================================================
    function applyFilters() {
      filterCategory = document.getElementById('filterCategory').value;
      filterDifficulty = document.getElementById('filterDifficulty').value;
      filterStatus = document.getElementById('filterStatus').value;

      // Determine which tab to show
      if (filterCategory !== 'all') {
        const tabBtn = document.querySelector(`.tab-btn[data-tab="${filterCategory}"]`);
        switchTab(filterCategory, tabBtn);
      }

      // Show/hide cards in all panels
      document.querySelectorAll('.question-card').forEach(card => {
        const cat = card.dataset.category;
        const diff = card.dataset.difficulty;
        const answered = card.dataset.answered === 'true';
        const isWrong = card.classList.contains('question-card--incorrect');

        let show = true;
        if (filterCategory !== 'all' && cat !== filterCategory) show = false;
        if (filterDifficulty !== 'all' && diff !== filterDifficulty) show = false;
        if (filterStatus === 'unanswered' && answered) show = false;
        if (filterStatus === 'answered' && !answered) show = false;
        if (filterStatus === 'wrong' && !isWrong) show = false;

        card.style.display = show ? '' : 'none';
      });

      // If category filter is set, only show that tab
      if (filterCategory !== 'all') {
        document.querySelectorAll('.tab-btn').forEach(b => {
          if (b.dataset.tab === filterCategory) {
            b.style.display = '';
          } else {
            b.style.display = 'none';
          }
        });
      } else {
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.style.display = '';
        });
      }
    }

    // ============================================================
    //  Random Practice
    // ============================================================
    function randomPractice() {
      // Find unanswered questions
      const unanswered = QUESTIONS.filter(q => {
        return localStorage.getItem('practice-Q' + q.id + '-correct') === null;
      });

      if (unanswered.length === 0) {
        alert('所有题目已完成！你可以通过"按状态筛选：错题"来复习。');
        return;
      }

      // Pick random
      const rand = unanswered[Math.floor(Math.random() * unanswered.length)];

      // Reset filters
      document.getElementById('filterCategory').value = 'all';
      document.getElementById('filterDifficulty').value = 'all';
      document.getElementById('filterStatus').value = 'all';
      document.querySelectorAll('.tab-btn').forEach(b => b.style.display = '');
      document.querySelectorAll('.question-card').forEach(c => c.style.display = '');

      // Switch to tab
      const tabBtn = document.querySelector(`.tab-btn[data-tab="${rand.category}"]`);
      switchTab(rand.category, tabBtn);

      // Show all cards in panel, then scroll
      document.querySelectorAll('.question-card').forEach(c => c.style.display = '');

      setTimeout(() => {
        const card = document.getElementById('qcard-' + rand.id);
        if (card) {
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          card.style.boxShadow = '0 0 0 2px var(--accent), 0 0 20px rgba(56,189,248,0.2)';
          setTimeout(() => {
            card.style.boxShadow = '';
          }, 2500);
        }
      }, 150);
    }

    // ============================================================
    //  Helpers
    // ============================================================
    function stripHTML(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      return tmp.textContent || tmp.innerText || '';
    }
  </script>

</body>
</html>
