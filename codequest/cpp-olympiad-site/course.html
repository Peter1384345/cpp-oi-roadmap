  <style>

    .breadcrumb a:hover { color: var(--accent); }

    /* ========== Course Header ========== */
    .course-header__title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .course-header__tag {
      display: inline-block;
      margin-bottom: 8px;
    }
    .course-header__title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.3;
    }
    .course-header__back {
      flex-shrink: 0;
      font-size: 0.85rem;
      padding: 8px 18px;
    }
    .course-header__nav {
      display: flex;

      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--rule);
    }
    .course-header__nav a {

      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--muted);
      border-radius: 8px;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    .course-header__nav a:hover:not(.disabled) {
      color: var(--ink);
      background: var(--surface);
      border-color: var(--rule);

    .course-header__nav a.disabled {

    /* ========== Stepper ========== */
    .stepper {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      margin: 28px 0 8px;
    }
    .stepper__item {
      display: flex;

      align-items: center;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .stepper__dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      background: transparent;
      transition: all 0.3s ease;
    }
    .stepper__item--completed .stepper__dot {
      background: var(--grad);
      border-color: transparent;
      color: #fff;
    }
    .stepper__item--active .stepper__dot {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }
    .stepper__label {
      margin-top: 8px;
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
      transition: color 0.3s;
    }
    .stepper__item--completed .stepper__label,
    .stepper__item--active .stepper__label {
      color: var(--ink);
      font-weight: 600;
    }
    .stepper__line {
      width: 64px;
      height: 2px;
      background: var(--rule);
      margin: 17px 12px 0;
      flex-shrink: 0;
      transition: background 0.4s ease;
      border-radius: 1px;
    }
    .stepper__line--done {
      background: var(--grad);
    }

    /* ========== Step Sections ========== */
    .step-section {
      margin-top: 32px;
    }
    .step-section__header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }
    .step-section__number {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--grad);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
    }
    .step-section__title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--ink);

    /* ========== Concept Section ========== */
    .concept-card {

      backdrop-filter: blur(10px);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 28px;
    }
    .video-embed {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      background: #0d1117;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 24px;
      border: 1px solid var(--rule);
    }
    .video-link {
      position: absolute;

      justify-content: center;
      text-decoration: none;
    }

      box-shadow: 0 4px 20px rgba(56,189,248,0.4);

    }
    .video-link:hover .video-play-btn {
      transform: scale(1.15);
    }
    .video-link-text {
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }
    .video-embed iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .video-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;

      justify-content: center;

      font-size: 1.2rem;
      color: var(--accent);
      cursor: pointer;
      transition: all 0.2s;
    }
    .video-placeholder__play:hover {
      background: var(--accent);
      color: #fff;
    }
    .concept-text {
      font-size: 0.95rem;
      line-height: 1.8;
      color: var(--ink);
      margin-bottom: 20px;
    }
    .concept-text p { margin-bottom: 12px; }
    .key-points {
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      border-radius: 0 10px 10px 0;
      padding: 18px 20px;
      margin: 20px 0;
    }
    .key-points__title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--accent);

    }
    .key-points li {
      position: relative;
      padding-left: 20px;
      margin-bottom: 8px;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--ink);

    }
    .key-points li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 9px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
    .step-action {
      margin-top: 24px;
      text-align: center;
    }

    /* ========== Quiz Section ========== */
    .quiz-progress {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .quiz-progress__bar {
      flex: 1;
      height: 4px;
      background: var(--surface);
      border-radius: 2px;
      overflow: hidden;
    }
    .quiz-progress__fill {
      height: 100%;
      background: var(--grad);
      border-radius: 2px;
      transition: width 0.4s ease;
    }
    .quiz-card {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      transition: border-color 0.3s;
    }
    .quiz-card__header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 18px;
    }
    .quiz-card__number {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      height: 28px;
      padding: 0 10px;
      border-radius: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
    }
    .quiz-card__question {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.6;
    }
    .quiz-card__code {
      display: block;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--rule);
      border-radius: 8px;
      padding: 12px 16px;
      margin: 12px 0;
      font-family: var(--font-code);
      font-size: 0.88rem;
      color: var(--accent);
      white-space: pre-wrap;
      word-break: break-all;
    }
    /* Choice Options */
    .quiz-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .quiz-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--rule);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      font-size: 0.9rem;
      color: var(--ink);
    }
    .quiz-option:hover:not(.selected):not(.correct):not(.wrong) {
      background: var(--surface-hover);
      border-color: rgba(148,163,184,0.3);
    }
    .quiz-option__label {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      transition: all 0.2s;
    }
    .quiz-option.selected .quiz-option__label {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }
    .quiz-option.correct {
      border-color: #10b981;
      background: rgba(16,185,129,0.1);
    }
    .quiz-option.correct .quiz-option__label {
      border-color: #10b981;
      background: #10b981;
      color: #fff;
    }
    .quiz-option.wrong {
      border-color: #ef4444;
      background: rgba(239,68,68,0.1);
      animation: shake 0.4s ease;
    }
    .quiz-option.wrong .quiz-option__label {
      border-color: #ef4444;
      background: #ef4444;
      color: #fff;
    }
    /* Fill Input */
    .quiz-fill {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .quiz-fill__input {
      flex: 1;
      padding: 12px 16px;
      background: rgba(0,0,0,0.3);
      border: 2px solid var(--rule);
      border-radius: 10px;
      font-family: var(--font-code);
      font-size: 0.9rem;
      color: var(--ink);
      transition: border-color 0.2s;
    }
    .quiz-fill__input:focus {
      border-color: var(--accent);
      outline: none;
    }
    .quiz-fill__input.correct { border-color: #10b981; }
    .quiz-fill__input.wrong { border-color: #ef4444; }
    .quiz-fill__input:disabled { opacity: 0.7; }
    .btn-check {
      padding: 12px 20px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(56,189,248,0.3);
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-check:hover { background: rgba(56,189,248,0.2); border-color: var(--accent); }
    .btn-check:disabled { opacity: 0.4; cursor: default; }
    /* Hint */
    .btn-hint {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      font-size: 0.85rem;
      color: var(--accent2);
      background: var(--accent2-soft);
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 12px;
    }
    .btn-hint:hover { border-color: rgba(167,139,250,0.3); }
    .hint-box {
      margin-top: 12px;
      padding: 14px 18px;
      background: var(--accent2-soft);
      border-left: 3px solid var(--accent2);
      border-radius: 0 8px 8px 0;
      font-size: 0.88rem;
      color: var(--ink);
      line-height: 1.6;
    }
    .hint-box .hint-level {
      font-weight: 700;
      color: var(--accent2);
      margin-bottom: 4px;
    }
    /* Feedback */
    .quiz-feedback {
      margin-top: 14px;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.6;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .quiz-feedback--correct {
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.25);
      color: #34d399;
    }
    .quiz-feedback--wrong {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      color: #fca5a5;
    }
    .quiz-feedback__icon {
      flex-shrink: 0;
      font-size: 1.1rem;
      margin-top: 1px;
    }
    .quiz-feedback__text { color: var(--ink); }

    /* ========== Challenge Section ========== */
    .challenge-card {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 28px;
    }
    .challenge-desc {
      font-size: 0.95rem;
      line-height: 1.8;
      color: var(--ink);
      margin-bottom: 16px;
    }
    .challenge-desc p { margin-bottom: 10px; }
    .challenge-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      color: var(--accent);
      margin-bottom: 20px;
      transition: gap 0.2s;
    }
    .challenge-link:hover { gap: 10px; color: var(--accent2); }
    .code-editor-wrapper {

    }
    .code-editor-wrapper__label {

      right: 14px;

      border-radius: 4px;
      pointer-events: none;
      z-index: 1;
    }
    .code-editor {
      width: 100%;
      min-height: 260px;
      background: #0d1117;
      border: 1px solid var(--rule);
      border-radius: 12px;
      padding: 20px;
      padding-top: 36px;
      font-family: var(--font-code);
      font-size: 0.88rem;
      color: #c9d1d9;
      line-height: 1.7;

    .code-editor:focus {

      outline: none;
    }
    .challenge-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn-run {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-run:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(16,185,129,0.3); }

    /* ========== Sidebar ========== */
    .course-sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: sticky;
      top: 80px;
    }
    .sidebar-card {
      padding: 20px;
    }
    .sidebar-card:hover {
      transform: none;
    }
    .sidebar-card__title {
      font-size: 0.92rem;

      padding-bottom: 10px;

    .sidebar-info {

    .sidebar-info__row {

    }
    .sidebar-info__label { color: var(--muted); }
    .sidebar-info__value { color: var(--ink); font-weight: 600; }
    .sidebar-resource {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      font-size: 0.85rem;
      color: var(--accent);
      transition: color 0.2s;
    }
    .sidebar-resource:hover { color: var(--accent2); }
    .sidebar-resource__icon { font-size: 1rem; flex-shrink: 0; }
    .notes-area {
      width: 100%;
      min-height: 100px;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 14px;
      font-family: var(--font-body);
      font-size: 0.85rem;
      color: var(--ink);
      line-height: 1.6;

    }
    .notes-area:focus {

      outline: none;
    }
    .notes-area::placeholder { color: var(--muted); }
    .complete-checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--ink);
      user-select: none;
    }
    .complete-checkbox input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* ========== AI Tutor ========== */
    .ai-tutor {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1500;
    }
    .ai-tutor__btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      background: var(--grad);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 24px rgba(56,189,248,0.3);
      transition: all 0.2s;
      font-family: var(--font-body);
    }
    .ai-tutor__btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(56,189,248,0.4); }
    .ai-tutor__btn.hidden { display: none; }
    .ai-tutor__panel {
      position: absolute;
      bottom: 60px;
      right: 0;
      width: 380px;
      max-height: 520px;
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 16px;
      display: none;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 12px 48px rgba(0,0,0,0.5);
    }
    .ai-tutor__panel.open { display: flex; }
    .ai-tutor__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--rule);
    }
    .ai-tutor__header h3 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--ink);
    }
    .ai-tutor__header button {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--surface);
      border: none;
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .ai-tutor__header button:hover { background: var(--surface-hover); }
    .ai-tutor__quick {
      display: flex;
      gap: 6px;
      padding: 12px 14px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--rule);
    }
    .ai-tutor__quick button {
      padding: 6px 12px;
      font-size: 0.78rem;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-body);
    }
    .ai-tutor__quick button:hover { border-color: rgba(56,189,248,0.3); background: rgba(56,189,248,0.15); }
    .ai-tutor__messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 300px;
    }
    .ai-msg {
      max-width: 88%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      line-height: 1.6;
    }
    .ai-msg--bot {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--rule);
      color: var(--ink);
    }
    .ai-msg--user {
      align-self: flex-end;
      background: var(--grad);
      color: #fff;
    }
    .ai-tutor__input {

    function renderStepper() {

      if (s3Done) currentStep = Math.max(currentStep, 3);

    /* ========== Step Navigation ========== */

    window.goToStep = function(step) {
      if (step < 1 || step > 3) return;
      if (!courseData[dayNum]) return;

      // Mark previous steps as done when moving forward
      if (step >= 2) {
        localStorage.setItem(lsKey('step1_done'), 'true');
        var xp = parseInt(localStorage.getItem('xp-total') || '0') + 10;
        localStorage.setItem('xp-total', String(xp));
      }
      if (step >= 3) {
        localStorage.setItem(lsKey('step2_done'), 'true');
        var xp = parseInt(localStorage.getItem('xp-total') || '0') + 20;
        localStorage.setItem('xp-total', String(xp));
      }

      currentStep = step;

      // Show/hide sections
      document.getElementById('step1').style.display = step >= 1 ? '' : 'none';
      document.getElementById('step2').style.display = step >= 2 ? '' : 'none';
      document.getElementById('step3').style.display = step >= 3 ? '' : 'none';

      renderStepper();

      // Scroll to the target section
      var targetId = 'step' + step;
      var target = document.getElementById(targetId);
      if (target) {
        setTimeout(function() {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
      }
    };

    /* ========== Quiz Logic ========== */

    window.selectOption = function(qi, oi) {
      if (quizAnswered[qi]) return;
      var q = courseData[dayNum].quizzes[qi];
      var card = document.getElementById('quizCard' + qi);
      var options = card.querySelectorAll('.quiz-option');

      // Mark selected
      for (var i = 0; i < options.length; i++) {
        options[i].classList.remove('selected');
      }
      options[oi].classList.add('selected');

      // Determine if correct
      var isCorrect = (oi === q.answer);

      // Show result after brief delay
      setTimeout(function() {
        if (isCorrect) {
          options[oi].classList.add('correct');
          showFeedback(qi, true, q.explanation);
          onQuizAnswered(qi);
        } else {
          options[oi].classList.add('wrong');
          options[q.answer].classList.add('correct');
          showFeedback(qi, false, q.explanation);
          // Allow retry after delay
          setTimeout(function() {
            options[oi].classList.remove('wrong', 'selected');
            options[oi].style.pointerEvents = '';
          }, 1500);
        }
      }, 300);

      // Disable all options temporarily
      for (var j = 0; j < options.length; j++) {
        options[j].style.pointerEvents = 'none';
      }
    };

    window.checkFill = function(qi) {
      if (quizAnswered[qi]) return;
      var q = courseData[dayNum].quizzes[qi];
      var input = document.getElementById('fillInput' + qi);
      var btn = document.getElementById('fillBtn' + qi);
      var userAnswer = input.value.replace(/\s+/g, '').toLowerCase();

      var isCorrect = false;
      for (var i = 0; i < q.answers.length; i++) {
        if (userAnswer === q.answers[i].replace(/\s+/g, '').toLowerCase()) {
          isCorrect = true;
          break;
        }
      }

      if (isCorrect) {
        input.classList.add('correct');
        btn.disabled = true;
        input.disabled = true;
        showFeedback(qi, true, q.explanation);
        onQuizAnswered(qi);
      } else {
        input.classList.add('wrong');
        showFeedback(qi, false, q.explanation);
        setTimeout(function() {
          input.classList.remove('wrong');
          input.value = '';
          input.focus();
        }, 1500);
      }
    };

    function showFeedback(qi, correct, explanation) {
      var el = document.getElementById('feedbackArea' + qi);
      el.innerHTML = '<div class="quiz-feedback ' + (correct ? 'quiz-feedback--correct' : 'quiz-feedback--wrong') + '">' +
                     '<span class="quiz-feedback__icon">' + (correct ? '&#10003;' : '&#10007;') + '</span>' +
                     '<span class="quiz-feedback__text">' + (correct ? '回答正确！' : '回答有误，再想想。') + ' ' + explanation + '</span></div>';
      // Hide hint button
      var hintBtn = document.getElementById('hintBtn' + qi);
      if (hintBtn && correct) hintBtn.style.display = 'none';
    }

    function onQuizAnswered(qi) {
      quizAnswered[qi] = true;
      localStorage.setItem(lsKey('quiz' + qi + '_done'), 'true');
      updateQuizProgress(courseData[dayNum].quizzes.length);

    function updateQuizProgress(total) {
      var done = Object.keys(quizAnswered).length;
      var text = document.getElementById('quizProgressText');
      var fill = document.getElementById('quizProgressFill');
      if (text) text.textContent = done + ' / ' + total + ' 已完成';
      if (fill) fill.style.width = (done / total * 100) + '%';

      // Show step 2 action button when all done
      if (done >= total) {
        var action = document.getElementById('step2Action');
        if (action) action.style.display = '';
      }
    }

    /* ========== Hint System ========== */

    window.showHint = function(qi) {
      if (!courseData[dayNum]) return;
      var q = courseData[dayNum].quizzes[qi];
      if (!hintLevel[qi]) hintLevel[qi] = 0;
      if (hintLevel[qi] >= q.hints.length) return;

      var el = document.getElementById('hintArea' + qi);
      var level = hintLevel[qi];
      var labels = ['提示一', '提示二', '提示三'];
      el.innerHTML = '<div class="hint-box"><div class="hint-level">' + labels[level] + '</div>' + q.hints[level] + '</div>';
      hintLevel[qi]++;

      // Disable hint button if no more hints
      if (hintLevel[qi] >= q.hints.length) {
        var btn = document.getElementById('hintBtn' + qi);
        if (btn) {
          btn.textContent = '已显示全部提示';
          btn.disabled = true;
          btn.style.opacity = '0.5';
        }
      }
    };

      }
      setTimeout(function() { addMessage('bot', reply); }, 600);
    };

    function addMessage(role, text) {
      var messages = document.getElementById('aiMessages');
      var div = document.createElement('div');
      div.className = 'ai-msg ai-msg--' + role;
      div.style.whiteSpace = 'pre-wrap';
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    /* ========== Helpers ========== */

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    /* ========== Init ========== */

    function init() {
      renderBreadcrumb();
      renderHeader();
      renderStepper();
      renderNav();

      var data = courseData[dayNum];
      if (data) {
        document.getElementById('placeholderSection').style.display = 'none';
        renderConcept(data);
        renderQuizzes(data.quizzes);
        renderChallenge(data);
        renderSidebar(data);

        // Restore visible steps
        if (localStorage.getItem(lsKey('step1_done')) === 'true') {
          document.getElementById('step2').style.display = '';
        }
        if (localStorage.getItem(lsKey('step2_done')) === 'true') {
          document.getElementById('step3').style.display = '';
        }
      } else {
        // Show placeholder
        document.getElementById('step1').style.display = 'none';
        document.getElementById('placeholderSection').style.display = '';
        renderSidebar(null);
      }
    }

    window.initCourse = init;

  })();
  </script>
  <script src="./assets/course-data-ext.js"></script>
  <script>
    if (typeof window.initCourse === 'function') window.initCourse();
  </script>

</body>
